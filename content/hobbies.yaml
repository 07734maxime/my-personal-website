# Everything shown on the Hobbies page.
#
# Each item needs a `title`. To get its cover and link automatically, give ONE id:
#   mal_anime / mal_manga  → MyAnimeList id (the number in myanimelist.net/anime/2167)
#   vndb                   → VNDB id (v4)
#   steam                  → Steam app id (the number in store.steampowered.com/app/1091500)
#   apple_music            → Apple Music album id (the number at the end of the album URL)
# Covers are downloaded into public/assets/img/covers/ by `npm run covers` (also run before dev/build).
# `image` and `url` override the automatic cover and link.

