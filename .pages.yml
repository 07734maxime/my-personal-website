media:
  input: public/assets/img
  output: /assets/img

content:
  - name: site
    label: Site (every page)
    type: file
    path: content/site.yaml
    format: yaml
    fields:
      - { name: name, label: Name, type: string, description: "Shown after each page's title in the browser tab, e.g. Projects — Maxime." }
      - { name: home_tab_title, label: Home page tab title, type: string }
      - { name: description, label: Description, type: text, description: "The home page's description in search results and link previews." }
      - { name: footer, label: Footer, type: string }
      - name: contact
        label: Contact links
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string, required: true }
          - { name: url, label: URL, type: string, required: true, description: "A full URL, or mailto:you@example.com for an email." }

  - name: home
    label: Home
    type: file
    path: content/home.yaml
    format: yaml
    fields:
      - { name: title, label: Title, type: string }
      - { name: intro, label: Intro, type: text }
      - { name: avatar, label: Avatar, type: image }
      - name: status
        label: Status table
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - name: rows
            label: Rows
            type: object
            list: true
            fields:
              - { name: label, label: Label, type: string, required: true }
              - { name: value, label: Value, type: string }
      - name: sections
        label: Sections
        type: object
        list: true
        fields:
          - { name: heading, label: Heading, type: string, required: true }
          - { name: body, label: Text, type: rich-text, options: { format: markdown } }

  - name: projects
    label: Projects
    type: file
    path: content/projects.yaml
    format: yaml
    fields:
      - { name: title, label: Title, type: string, description: "Also the menu label." }
      - { name: intro, label: Intro, type: text }
      - name: sections
        label: Sections
        type: object
        list: true
        fields:
          - { name: heading, label: Heading, type: string, required: true }
          - { name: intro, label: Intro, type: text }
          - name: projects
            label: Projects
            type: object
            list: true
            fields:
              - { name: name, label: Name, type: string, required: true }
              - { name: status, label: Status, type: select, options: { values: [Live, WIP, Discontinued, Abandoned] } }
              - { name: link, label: Link, type: string, description: "A page of this site (/hobbies) or a full URL." }
              - { name: tags, label: Made with, type: string, list: true }
              - { name: description, label: Description, type: text }

  - name: hobbies
    label: Hobbies
    type: file
    path: content/hobbies.yaml
    format: yaml
    fields:
      - { name: title, label: Title, type: string, description: "Also the menu label." }
      - { name: intro, label: Intro, type: text }
      - name: sections
        label: Sections
        type: object
        list: true
        fields:
          - { name: heading, label: Heading, type: string, required: true }
          - { name: intro, label: Intro, type: text, description: "Shown before the favorite and the lists." }
          - name: favorite
            label: Favorite
            type: object
            fields:
              - { name: title, label: Title, type: string }
              - { name: note, label: Quote, type: string }
              - { name: mal_anime, label: MyAnimeList anime id, type: number }
              - { name: mal_manga, label: MyAnimeList manga id, type: number }
              - { name: vndb, label: VNDB id, type: string }
              - { name: steam, label: Steam app id, type: number }
              - { name: image, label: Custom cover, type: image }
              - { name: url, label: Custom link, type: string }
          - name: lists
            label: Lists
            type: object
            list: true
            fields:
              - { name: heading, label: Heading, type: string, required: true, description: "Like Shelf, Up next, Backlog." }
              - name: items
                label: Items
                type: object
                list: true
                fields:
                  - { name: title, label: Title, type: string, required: true }
                  - { name: artist, label: Artist, type: string, description: "For albums: shown after the title." }
                  - { name: mal_anime, label: MyAnimeList anime id, type: number, description: "The number in myanimelist.net/anime/2167. Gives the cover and the link." }
                  - { name: mal_manga, label: MyAnimeList manga id, type: number, description: "The number in myanimelist.net/manga/2. Gives the cover and the link." }
                  - { name: vndb, label: VNDB id, type: string, description: "Like v4 (vndb.org/v4). Gives the cover and the link." }
                  - { name: steam, label: Steam app id, type: number, description: "The number in store.steampowered.com/app/1091500. Gives the cover and the link." }
                  - { name: apple_music, label: Apple Music album id, type: number, description: "The number at the end of the album URL. Gives the cover and the link." }
                  - { name: image, label: Custom cover, type: image, description: "Only if the automatic cover is wrong or there is no id." }
                  - { name: url, label: Custom link, type: string, description: "Only if the automatic link is wrong or there is no id." }
          - { name: outro, label: Outro, type: text, description: "Shown after the lists." }

  - name: dev
    label: Dev
    type: file
    path: content/dev.yaml
    format: yaml
    fields:
      - { name: title, label: Title, type: string, description: "Also the menu label." }
      - { name: intro, label: Intro, type: text }
      - name: setup
        label: Setup
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - name: groups
            label: Groups
            type: object
            list: true
            fields:
              - { name: heading, label: Heading, type: string, required: true, description: "Like System, Languages, Tools." }
              - name: items
                label: Items
                type: object
                list: true
                fields:
                  - { name: name, label: Name, type: string, required: true }
                  - { name: details, label: Details, type: string }
                  - { name: url, label: Link, type: string }
      - name: log
        label: Dev log
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - name: entries
            label: Entries
            type: object
            list: true
            fields:
              - { name: date, label: Date, type: date, required: true }
              - { name: text, label: What happened, type: text, required: true }
